<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- The code is in the address bar; it must not travel to whatever is tapped next. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Nomad Budget — Join wallet</title>
<!--
  Hand-written, not produced by scripts/export-legal.mjs. Where a wallet invite link
  lands when the app does not catch it: no app installed, or the domain not yet
  verified for it (see src/lib/inviteLink.ts). It hands the same code on through
  the app's own scheme, and otherwise offers it for copying — the join sheet's
  paste field takes it. Served at https://legal.rubeeks.co/nomadbudget/join
  (GitHub Pages resolves the extension) — copy into the legal repo alongside the
  documents.
-->
<style>
:root {
  color-scheme: light dark;
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --surface-muted: #EEF1F6;
  --ink: #0E1726;
  --ink-soft: #3A4658;
  --muted: #6B7684;
  --border: #E7ECF2;
  --accent: #11371C;
  --lime: #52D69B;
  --wash-solid: #DCE3ED;
  --wash: linear-gradient(135deg, #E1DDEC 0%, #DCE3ED 52%, #D1E8DE 100%);
  --shadow: 0 1px 2px rgba(12,24,36,.05), 0 18px 44px rgba(12,24,36,.07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B1220;
    --surface: #1D2736;
    --surface-muted: #29354A;
    --ink: #E9EEF5;
    --ink-soft: #B7C2D0;
    --muted: #8B97A6;
    --border: #303D52;
    --accent: #52D69B;
    --wash-solid: #141C2B;
    --wash: linear-gradient(135deg, #161E2E 0%, #141C2B 52%, #122320 100%);
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 18px 44px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: 32px 16px 56px;
  background: var(--bg);
  color: var(--ink-soft);
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.65;
}
a { color: var(--accent); text-underline-offset: 2px; }
.card {
  max-width: 480px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.wash {
  background-color: var(--wash-solid);
  background-image: var(--wash);
  padding: 40px 28px 34px;
  text-align: center;
}
.wash img { display: block; width: 64px; height: 64px; margin: 0 auto; }
.wordmark {
  display: block;
  margin-top: 12px;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.2;
  color: var(--ink);
}
.rule { display: flex; width: 72px; height: 3px; margin: 12px auto 0; border-radius: 2px; overflow: hidden; }
.rule i:nth-child(1) { width: 30%; background: #52D69B; }
.rule i:nth-child(2) { width: 26%; background: #2E90FA; }
.rule i:nth-child(3) { width: 24%; background: #EE46BC; }
.rule i:nth-child(4) { width: 20%; background: #F79009; }
.doc { padding: 30px 28px 34px; text-align: center; }
h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.25; font-weight: 800; letter-spacing: -0.5px; color: var(--ink); }
p { margin: 0 0 14px; }
.meta { font-size: 14px; color: var(--muted); }
.btn {
  display: block;
  width: 100%;
  margin-top: 22px;
  padding: 16px 20px;
  border: 0;
  border-radius: 18px;
  background: var(--ink);
  color: var(--bg);
  font: inherit;
  font-weight: 700;
  text-decoration: none;
  text-align: center;
  cursor: pointer;
}
.btn.soft { background: var(--surface-muted); color: var(--ink); border: 1px solid var(--border); margin-top: 10px; }
.btn.soft:hover { border-color: var(--lime); }
.code {
  margin-top: 22px;
  padding: 14px 16px;
  background: var(--surface-muted);
  border: 1px solid var(--border);
  border-radius: 18px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 14px;
  letter-spacing: 0.5px;
  color: var(--ink);
  word-break: break-all;
  user-select: all;
}
.hint { margin-top: 12px; font-size: 14px; color: var(--muted); }
.stores { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.stores a { font-size: 14px; }
[hidden] { display: none !important; }
footer { max-width: 480px; margin: 22px auto 0; padding: 0 12px; font-size: 13px; line-height: 1.6; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <main class="card">
    <div class="wash">
      <img src="https://czgrnmolqcbgvoctqpwp.supabase.co/storage/v1/object/public/brand/coin.png" alt="" width="64" height="64">
      <span class="wordmark">Nomad Budget</span>
      <div class="rule"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="doc">
      <div id="ok" hidden>
        <h1 data-i18n="title"></h1>
        <p class="meta" data-i18n="lede"></p>
        <a id="open" class="btn" href="#" data-i18n="open"></a>
        <div class="code" id="code"></div>
        <button id="copy" class="btn soft" type="button" data-i18n="copy"></button>
        <p class="hint" data-i18n="pasteHint"></p>
        <p class="hint" data-i18n="expires"></p>
        <div class="stores" id="stores" hidden>
          <span data-i18n="noApp"></span>
          <a id="ios" data-i18n="appStore"></a>
          <a id="android" data-i18n="playStore"></a>
        </div>
      </div>
      <div id="bad" hidden>
        <h1 data-i18n="badTitle"></h1>
        <p class="meta" data-i18n="badLede"></p>
      </div>
    </div>
  </main>
  <footer><a href="./index.html">Nomad Budget</a> · <a href="./privacy.en.html" data-i18n="privacy"></a></footer>
<script>
(function () {
  // Store listings, once there are any — the "don't have the app?" line stays
  // hidden until both are filled in, rather than pointing at nothing.
  var STORE = { ios: '', android: '' };
  var PACKAGE = 'com.nomadbudget.mobile';

  var STRINGS = {
    en: {
      title: 'You have been invited to a wallet',
      lede: 'Someone is sharing a Nomad Budget wallet with you.',
      open: 'Open in Nomad Budget',
      copy: 'Copy code',
      copied: 'Copied',
      pasteHint: 'If the app does not open: in Nomad Budget go to Settings → Share wallet → Scan invite → Paste code, and paste this code.',
      expires: 'The invitation is valid for 15 minutes after it was created.',
      noApp: 'Don’t have the app?',
      appStore: 'App Store',
      playStore: 'Google Play',
      badTitle: 'This link is incomplete',
      badLede: 'The invitation code is missing. Ask the person who invited you to send the link again.',
      privacy: 'Privacy'
    },
    tr: {
      title: 'Bir cüzdana davet edildin',
      lede: 'Biri seninle bir Nomad Budget cüzdanı paylaşıyor.',
      open: 'Nomad Budget’te aç',
      copy: 'Kodu kopyala',
      copied: 'Kopyalandı',
      pasteHint: 'Uygulama açılmazsa: Nomad Budget’te Ayarlar → Cüzdan paylaş → Davet okut → Kodu yapıştır yolunu izleyip bu kodu yapıştır.',
      expires: 'Davet, oluşturulduktan sonra 15 dakika geçerli.',
      noApp: 'Uygulama yok mu?',
      appStore: 'App Store',
      playStore: 'Google Play',
      badTitle: 'Bu bağlantı eksik',
      badLede: 'Davet kodu yok. Seni davet eden kişiden bağlantıyı yeniden göndermesini iste.',
      privacy: 'Gizlilik'
    }
  };
  var lang = (navigator.language || '').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
  var t = STRINGS[lang];
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t[nodes[i].getAttribute('data-i18n')];
  if (lang === 'tr') document.querySelector('footer a[data-i18n]').href = './privacy.tr.html';

  // The code, reduced to the 32 hex characters it is — the same rule the app's
  // paste field applies, so what is shown here is what the app will accept.
  var raw = new URLSearchParams(location.search).get('code') || '';
  var code = raw.replace(/[^0-9a-fA-F]/g, '').toLowerCase().slice(0, 32);
  if (code.length !== 32) {
    document.getElementById('bad').hidden = false;
    return;
  }
  document.getElementById('ok').hidden = false;
  document.getElementById('code').textContent = code;

  // Android Chrome: an intent:// address opens the app when it is installed and
  // comes back here (rather than to a Play page for a package that may not be
  // listed yet) when it is not. Everything else: the app's own scheme, which iOS
  // answers with its "Open in Nomad Budget?" prompt.
  var scheme = 'nomadbudget://join?code=' + code;
  var android = /android/i.test(navigator.userAgent);
  var here = location.href.replace(/#.*$/, '');
  document.getElementById('open').href = android
    ? 'intent://join?code=' + code + '#Intent;scheme=nomadbudget;package=' + PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(here) + ';end'
    : scheme;

  var copy = document.getElementById('copy');
  copy.addEventListener('click', function () {
    var done = function () { copy.textContent = t.copied; setTimeout(function () { copy.textContent = t.copy; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(done, function () {});
    } else {
      var range = document.createRange();
      range.selectNodeContents(document.getElementById('code'));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      try { if (document.execCommand('copy')) done(); } catch (e) {}
    }
  });

  if (STORE.ios && STORE.android) {
    document.getElementById('ios').href = STORE.ios;
    document.getElementById('android').href = STORE.android;
    document.getElementById('stores').hidden = false;
  }
})();
</script>
</body>
</html>
